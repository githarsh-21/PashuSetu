<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA Manifest & Theme -->
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Apple iOS Mobile App Meta Tags -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PashuSetu" />

  <title>PashuSetu | Digital Livestock & AI Triage</title>
</head>

<body
  class="bg-slate-50 text-slate-900 antialiased overflow-x-hidden selection:bg-emerald-200 selection:text-emerald-900">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Native Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Points directly to the public/sw.js file mapped at the root
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('🐄 PashuSetu Service Worker Registered! Scope:', reg.scope))
          .catch(err => console.error('SW Registration Failed:', err));
      });
    }
  </script>
</body>

</html>
